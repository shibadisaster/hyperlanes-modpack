[technology-description]
ipg-interplanetary-power-grid=Wormhole pylons let separate surfaces share one electric network, so power generated anywhere becomes available everywhere, planets and space platforms alike.
legendary-quality=Allows the production of Space-grade items.

hyperlanes-t2-epp=Unlocks the Rebreathing EPP which recycles breathable air, allowing you to survive on the airless surface of __PLANET__muluna__.
hyperlanes-t3-epp=Unlocks the Environmental protection EPP which shields you against the intense heat of __PLANET__vulcanus__, the duststorms of __PLANET__fulgora__, and the highly-toxic biosphere of __PLANET__gleba__.
hyperlanes-t4-epp=Unlocks the Radiation resistance EPP which protects you against radioactive particles, allowing you to survive on the highly-irradiated surface of __PLANET__cerys__.
hyperlanes-t5-epp=Unlocks the Particulate filtering EPP which removes harmful particulates from your armor system, such as the ultra-fine sands of __PLANET__arig__, the abrasive high-speed duststorms of __PLANET__rubia__, and the superacidic spores on __PLANET__muria__.
hyperlanes-t6-epp=Unlocks the Climate control EPP which provides an advanced cooling system, keeping you comfortable even on the inhospitable temperatures of the surfaces of __PLANET__hyarion__ and __PLANET__moshine__.
hyperlanes-t7-epp=Unlocks the Advanced climate control EPP which not only provides heating for comfort on __PLANET__aquilo__, but also pressure regulation, allowing you to survive the depths of __PLANET__maraxsis__.
hyperlanes-t8-epp=Unlocks the Total protection EPP, encasing you in a metamaterial shell that can resist even the most hostile of environments, including the bottomless sea of clouds of __PLANET__vesta__, deadly parasites and pathogens of __PLANET__tellus__, and the near-absolute zero temperatures of __PLANET__paracelsin__.
hyperlanes-t9-epp=Unlocks the Interstellar capability EPP which protects you against the intense radiation of the interstellar void, especially on the way to the Shattered Planet.
hyperlanes-t10-epp=Unlocks the Temporal stability EPP which nullifies temporal anomalies, allowing you to enter the antilinear zones of __PLANET__panglia__ without the risk of incredibly accelerated senescence.

hyperlanes-launching-bonuses=Toss low-quality waste into the Rubian wind in order to gain insights about the machinery that produced them.
hyperlanes-data-analysis=Condense high-quality science packs into raw relevant data, then analyze them using a Compute farm for analyzed data that can be used to improve related recipes.
hyperlanes-enlightenment=Expose a Sentient processor to the summation of your gathered knowledge in an effort to make it achieve [font=moshine-data][color=#FFFFFF]enlightenment[/color][/font].
hyperlanes-victory=By inducing [font=moshine-data][color=#FFFFFF]enlightenment[/color][/font] in an artificial consciousness, you are able to communicate with it to leverage its insights for extremely powerful technologies. 
hyperlanes-speed-module=Utilize antimatter to generate a time dilation effect, which speeds up machines without compromising the quality of their output or productivity.
hyperlanes-efficiency-module=Utilize antimatter to generate a dimensional distortion effect, which can be used to draw power from other dimensions for free, reducing power usage of machinery.
hyperlanes-productivity-module=Utilize antimatter to generate a spatial warping effect, which can be used to replicate the outputs of machinery without compromising speed.
hyperlanes-quality-module=Utilize the radioactive properties of promethium to scan for defects during production, significantly increasing quality without compromising speed.
hyperlanes-antimatter-chunk=Convert promethium asteroids into antimatter via extreme temperature gradients.
hyperlanes-antimatter-processing=Process antimatter without risk of annihilation and use photons to slow its decay.
hyperlanes-time-crystal=Produce time crystals, which naturally oscillate between a matter-attuned and antimatter-attuned state.
hyperlanes-advanced-material-microsuspension=Use Fulgoran cryogenic machinery to finely powderize various materials and suspend them in solution for various material applications.
hyperlanes-elementary-catalyst=Produce radioactive catalysts, which can provide chemical energy through radiation for certain reactions.
hyperlanes-sealant=Produce a simple sealant to prevent environmental corrosion of machines.
hyperlanes-metamaterial-microsuspension=Utilize the material-synthesizing bacteria of Rubia to improve the mechanical properties of material suspensions.
hyperlanes-superacid=Combine various acids to produce a highly acidic solution for various chemical and material applications.
hyperlanes-supercooled-magnet=Cool neodymium magnets to extremely low temperatures to produce extremely powerful magnets.
hyperlanes-volatile-catalyst=Produce volatile catalysts, which can provide chemical energy for certain complex reactions.
hyperlanes-bioslurry=Produce bioslurry, an extremely dense distillation of organic matter that can be used as an advanced nutrient supply for complex organisms.
hyperlanes-osmium=Convert iridium into osmium via particle manipulation, allowing for a number of extremely advanced material applications.
hyperlanes-artificial-lifeform=Produce artificial chimeral lifeforms by blending the DNA of various organisms.
hyperlanes-bose-einstein-condensate=Produce Bose-Einstein condensate, which has a number of applications in supercooling
hyperlanes-ethereal-quality=Leverage enlightened insights to achieve never-before-seen levels of quality.
hyperlanes-upcycling-q2-to-q3=Use even more data to detect and isolate high quality asteroid chunks.
hyperlanes-upcycling-q3-to-q4=Use even more data to detect and isolate high quality asteroid chunks.
hyperlanes-upcycling-q4-to-q5=Use even more data to detect and isolate high quality asteroid chunks.
hyperlanes-upcycling-q5-to-q6=Use even more data to detect and isolate high quality asteroid chunks.
hyperlanes-upcycling-q6-to-q7=Use even more data to detect and isolate high quality asteroid chunks.


