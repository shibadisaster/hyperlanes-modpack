[technology-description]
hyperlanes-t2-epp=Unlocks the Rebreathing EPP which recycles breathable air, allowing you to survive on the airless surface of __PLANET__muluna__.
hyperlanes-t3-epp=Unlocks the Environmental protection EPP which shields you against the intense heat of __PLANET__vulcanus__, the duststorms of __PLANET__fulgora__, and the highly-toxic biosphere of __PLANET__gleba__.
hyperlanes-t4-epp=Unlocks the Radiation resistance EPP which protects you against radioactive particles, allowing you to survive on the highly-irradiated surface of __PLANET__cerys__.
hyperlanes-t5-epp=Unlocks the Particulate filtering EPP which removes harmful particulates from your armor system, such as the ultra-fine sands of __PLANET__arig__, the abrasive high-speed duststorms of __PLANET__rubia__, and the superacidic spores on __PLANET__muria__.
hyperlanes-t6-epp=Unlocks the Climate control EPP which provides an advanced cooling system, keeping you comfortable even on the inhospitable temperatures of the surfaces of __PLANET__hyarion__ and __PLANET__moshine__.
hyperlanes-t7-epp=Unlocks the Advanced climate control EPP which not only provides heating for comfort on __PLANET__aquilo__, but also pressure regulation, allowing you to survive the depths of __PLANET__maraxsis__.
hyperlanes-t8-epp=Unlocks the Total protection EPP, encasing you in an impenetrable metamaterial shell that can survive even the most hostile of environments, including the bottomless sea of clouds of __PLANET__vesta__, deadly parasites and pathogens of __PLANET__tellus__, and the near-absolute zero temperatures of __PLANET__paracelsin__.
hyperlanes-t10-epp=Unlocks the Temporal stability EPP which nullifies temporal anomalies, allowing you to enter the antilinear zones of __PLANET__panglia__ without the risk of incredibly accelerated senescence.

